#This file is part of calamares installer for ALG

backend: pacman

skip_if_no_internet: false
update_db: false
update_system: false

pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: false


operations:
  - try_remove:
    - calamares
    - hwinfo
    - squashfs-tools
    - linux-atm
    - mkinitcpio-archiso
    - arch-install-scripts
    - ckbcomp
    - pearos-livecd-desktop
