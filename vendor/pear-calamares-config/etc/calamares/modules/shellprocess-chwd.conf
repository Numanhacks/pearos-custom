#
# Configuration for the shell process job.
# Runs chwd hardware autodetection (GPU/wifi drivers) in the target chroot.
#
# timeout is generous on purpose: nvidia-580xx-utils alone is ~360 MB to
# download, plus kernel headers, plus a DKMS module build on the target CPU.
# The old 1000 s could be hit on a slow connection.

i18n:
     name: "Installing needed drivers"

dontChroot: true
timeout: 3600
script:
    - command: "-arch-chroot ${ROOT} /etc/calamares/scripts/chwd-install"
