# kernel-params-performance.conf — append to kernel cmdline (apply-kernel-params.sh style)
# SECURITY WARNING: 'mitigations=off' disables Spectre/Meltdown/etc protections.
# Measurable gain on 4980U: ~3-8% sysbench/compile. ONLY for benchmarking or
# single-user machines with trusted code. Remove the line for daily use.

# x86 (AMD 4980U picks amd-idle via processor.* fallback):
processor.max_cstate=1
processor_idle.max_cstate=1
amd_prefcore=1

# housekeeping cores 0-1, isolated cores 2-N (4980U: 16 threads)
nohz_full=2-15
rcu_nocbs=2-15
irqaffinity=0-1

# PCIe perf + fast NVMe polling
pci=pcie_bus_perf
nvme.poll_queues=8
nvme_core.io_timeout=30

# crypto seed from RDRAND (no boot delay)
random.trust_cpu=on

# split-lock detection costs ~10x on aligned-lock workloads; benchmarks want it off
split_lock_detect=off

# UNCOMMENT ONLY FOR BENCHMARKS (see warning above):
# mitigations=off
