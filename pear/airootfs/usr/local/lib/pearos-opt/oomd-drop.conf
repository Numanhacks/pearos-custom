# Drop-in: /etc/systemd/oomd.conf.d/50-macos-memory.conf
# Pressure-based kills (NOT legacy OOM killer): kill only after sustained
# pressure, never on momentary spikes. macOS-like: kill only under extreme
# pressure, prefer reclaim first.
[OOM]
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
SwapUsedLimit=90%
