# /etc/sysctl.d/99-macos-memory.conf
# macOS-like VM behavior: keep cache, compress early, swap cheaply (zram),
# avoid NUMA thrash, reduce kernel accounting overhead.
# Managed by optimize-memory.sh — do not edit by hand; changes are overwritten.

# zram is compressed RAM — swapping to it is nearly free, so prefer it
# aggressively (disk swap is demoted to pri=10 and only used after zram).
# CachyOS/Fedora zram defaults land at 100-180; 100 is the balanced pick.
vm.swappiness = 100

# Anti-stall: watermark boost causes multi-hundred-ms allocation stalls under
# bursty allocation (app launch). Disable boost, widen the scale band so kswapd
# starts earlier and finishes smoother.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Keep dentries/inodes in cache longer (fast app launching, file browsing)
vm.vfs_cache_pressure = 50

# Smoother writeback: flush more often in the background, smaller bursts
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# 4K swap-in granularity — mandatory for zram/zswap (no cluster reads)
vm.page-cluster = 0

# Never reclaim from local node aggressively (desktops are NUMA-agnostic)
vm.zone_reclaim_mode = 0
kernel.numa_balancing = 0

# Reduce per-CPU VM stat update frequency (saves cycles on 4GB systems)
vm.stat_interval = 10
