# Drop-in for slices: opt-in oomd monitoring on system.slice, user.slice, user@.service
# Managed by optimize-memory.sh
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
ManagedOOMSwap=kill
# sshd, dbus, systemd are protected via ManagedOOMPreference=avoid drop-ins
# generated by oomd-protect.sh (see package).
